<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Styled Button Collection</h1>
        <p>Demonstrating button styles and pseudo-classes using CSS</p>
    </header>

    <main class="button-container">
        
        <!-- Primary Button -->
        <div class="button-group">
            <button class="btn btn-primary">Primary Button</button>
            <p>Standard action button</p>
        </div>

        <!-- Secondary Button -->
        <div class="button-group">
            <button class="btn btn-secondary">Secondary Button</button>
            <p>Alternative action button</p>
        </div>

        <!-- Outline Button -->
        <div class="button-group">
            <button class="btn btn-outline">Outline Button</button>
            <p>Bordered button with transparent background</p>
        </div>

        <!-- Disabled Button -->
        <div class="button-group">
            <button class="btn" disabled>Disabled Button</button>
            <p>Inactive state using the disabled attribute</p>
        </div>

    </main>

    <footer>
        <p>Assignment 8 - Question 5 Completed by Chetan</p>
    </footer>

</body>
</html>

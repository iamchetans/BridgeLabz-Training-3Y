<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Beautiful Destinations</h1>
        <p>A modern image showcase using CSS Grid and Hover effects.</p>
    </header>

    <!-- Main Container using CSS Grid -->
    <main class="grid-container">
        
        <!-- Image Card 1 -->
        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://images.pexels.com/photos/164170/pexels-photo-164170.jpeg?auto=compress&cs=tinysrgb&w=500&h=300&dpr=1" alt="Mountain Landscape">
                <div class="overlay"></div> <!-- Dark overlay on hover -->
            </div>
            <figcaption>Serene Mountains</figcaption>
        </figure>

        <!-- Image Card 2 -->
        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500&q=80" alt="Forest Pathway">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest Pathway</figcaption>
        </figure>

        <!-- Image Card 3 -->
        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500&q=80" alt="Misty Hills">
                <div class="overlay"></div>
            </div>
            <figcaption>Misty Hills</figcaption>
        </figure>

        <!-- Image Card 4 -->
        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://images.pexels.com/photos/189349/pexels-photo-189349.jpeg?auto=compress&cs=tinysrgb&w=500&h=300&dpr=1" alt="Ocean Sunset">
                <div class="overlay"></div>
            </div>
            <figcaption>Ocean Sunset</figcaption>
        </figure>

        <!-- Image Card 5 -->
        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=500&q=80" alt="Deep Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Deep Forest</figcaption>
        </figure>

        <!-- Image Card 6 -->
        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500&q=80" alt="Snowy Peaks">
                <div class="overlay"></div>
            </div>
            <figcaption>Snowy Peaks</figcaption>
        </figure>

    </main>

    <footer>
        <p>Assignment 8 - Question 3 Completed by Chetan</p>
    </footer>

</body>
</html>

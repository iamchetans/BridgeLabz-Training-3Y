<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Using @keyframes and animation properties</p>
    </header>

    <!-- Semantic Main Content with Flexbox Centering -->
    <main class="animation-container">
        
        <!-- Animation 1: Color Changing Text -->
        <section class="anim-box">
            <h2 class="color-text">Rainbow Text</h2>
            <p>Infinite loop, alternate direction</p>
        </section>

        <!-- Animation 2: Bouncing Ball -->
        <section class="anim-box">
            <div class="bounce-area">
                <div class="ball"></div>
            </div>
            <p>Bouncing with ease-in-out and delay</p>
        </section>

        <!-- Animation 3: Moving Box -->
        <section class="anim-box">
            <div class="moving-box">Slide</div>
            <p>Moves left and right continuously</p>
        </section>

    </main>

    <footer>
        <p>Assignment 8 - Question 6 Completed by Chetan</p>
    </footer>

</body>
</html>

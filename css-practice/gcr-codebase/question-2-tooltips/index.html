<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the icons or words to see smooth CSS-only tooltips.</p>
    </header>

    <!-- Main Container using Flexbox to center everything -->
    <main class="flex-center-container">
        
        <!-- Example 1: Text Tooltip -->
        <div class="tooltip-container">
            <span class="hover-text">Hover Me!</span>
            <span class="tooltip-box">This is a text tooltip!</span>
        </div>

        <!-- Example 2: Button Tooltip -->
        <div class="tooltip-container">
            <button class="hover-btn">Action Button</button>
            <span class="tooltip-box">Click here to submit</span>
        </div>

        <!-- Example 3: Icon Tooltip (Using an emoji as an icon) -->
        <div class="tooltip-container">
            <span class="hover-icon">ℹ️</span>
            <span class="tooltip-box">More information here.</span>
        </div>

    </main>

    <footer>
        <p>Assignment 8 - Question 2 Completed by Chetan</p>
    </footer>

</body>
</html>

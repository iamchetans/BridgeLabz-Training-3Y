<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform and Transition Interactive Elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Transforms & Transitions</h1>
        <p>Demonstrating rotate, scale, and translate on hover</p>
    </header>

    <!-- Main Container using Flexbox -->
    <main class="interactive-layout">

        <!-- Element 1: 360 Degree Rotation -->
        <section class="interactive-box">
            <div class="rotate-element">
                <span>360°</span>
            </div>
            <p>Hover to Rotate 360°</p>
        </section>

        <!-- Element 2: Scale Image -->
        <section class="interactive-box">
            <div class="scale-element">
                <!-- Using a placeholder image for demonstration -->
                <img src="https://images.pexels.com/photos/414612/pexels-photo-414612.jpeg?auto=compress&cs=tinysrgb&w=300&h=200&dpr=1" alt="Landscape">
            </div>
            <p>Hover to Scale Image</p>
        </section>

        <!-- Element 3: Translate Y Button -->
        <section class="interactive-box">
            <button class="translate-btn">Move Up</button>
            <p>Hover to Translate Y</p>
        </section>

    </main>

    <footer>
        <p>Assignment 8 - Question 7 Completed by Chetan</p>
    </footer>

</body>
</html>
